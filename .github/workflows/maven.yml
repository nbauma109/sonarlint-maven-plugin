name: Maven Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require Eclipse JDT licensing clearance
        shell: bash
        env:
          ECLIPSE_JDT_LICENSE_APPROVED: ${{ vars.ECLIPSE_JDT_LICENSE_APPROVED }}
        run: |
          if [ "$ECLIPSE_JDT_LICENSE_APPROVED" != "true" ]; then
            echo "::error::Eclipse JDT license clearance is required before release; see docs/eclipse-jdt-licensing.md"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure Git SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing SSH_PRIVATE_KEY"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing KNOWN_HOSTS"; exit 1; }
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config --global user.email "git@github.com"
          git config --global user.name "git"

      - name: Release with Maven
        run: mvn --no-transfer-progress -B -Dusername=git -Darguments="-Dgpg.skip=true" release:clean release:prepare release:perform
