name: Experimental transformer-api parity test

on:
  push:
    branches:
      - feat/local-modern-java-parity-rules

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
      - name: Install the candidate analysis plugin locally
        run: mvn -B -ntp -DskipTests install
      - uses: actions/checkout@v7
        with:
          repository: nbauma109/transformer-api
          ref: fdc55663e6c9d5836db57e6369fd08d6bc4651cd
          path: transformer-api
      - name: Compile transformer-api production sources
        run: mvn -B -ntp -f transformer-api/pom.xml compile
      - name: Analyze transformer-api using candidate plugin
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f transformer-api/pom.xml \
            io.github.nbauma109:static-analysis-maven-plugin:0.1.1-SNAPSHOT:check \
            -DstaticAnalysis.profile=sonar-way \
            -DstaticAnalysis.failOnViolation=false \
            | tee transformer-api-analysis.log
          echo "Findings per rule:"
          grep -E '\[WARNING\].*\[(java|javabugs):S[0-9]+\]' transformer-api-analysis.log \
            | sed -E 's/.*\[((java|javabugs):S[0-9]+)\].*/\1/' \
            | sort | uniq -c || true
