name: Embedded JDT Core Manipulation feasibility

on:
  push:
    branches:
      - spike/embedded-jdt-core-cleanups
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and exercise embedded JDT core cleanup logic
        run: |
          mvn -B -ntp -f src/it/embedded-jdt-core-cleanups/pom.xml \
            compile exec:java | tee embedded-jdt-core.log
          grep -F 'EMBEDDED_JDT_CORE_SUCCESS' embedded-jdt-core.log
