name: Build Gradle plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gradle-plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'
      - name: Verify Gradle plugin with the Java fixture
        run: gradle --no-daemon -p gradle-plugin build
