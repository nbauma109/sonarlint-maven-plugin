name: Transformer API pinned SonarCloud parity

on:
  pull_request:
    paths:
      - pom.xml
      - src/main/java/**
      - src/it/**
      - scripts/verify-transformer-api-parity.py
      - .github/workflows/transformer-api-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: |
            21
            25
          cache: maven
      - name: Install candidate static analysis plugin locally
        run: mvn -B -ntp -DskipTests install
      - uses: actions/checkout@v7
        with:
          repository: nbauma109/transformer-api
          ref: fdc55663e6c9d5836db57e6369fd08d6bc4651cd
          path: transformer-api
      - name: Compile pinned production sources
        run: mvn -B -ntp -f transformer-api/pom.xml compile
      - name: Collect production findings
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f transformer-api/pom.xml \
            io.github.nbauma109:static-analysis-maven-plugin:0.1.1-SNAPSHOT:check \
            -DstaticAnalysis.profile=sonar-way \
            -DstaticAnalysis.failOnViolation=false \
            | tee transformer-api-analysis.log
      - name: Assert embedded JDT field-finality rules run without an Eclipse installation
        run: grep -F 'Embedded Eclipse JDT core cleanups found 8 private-field finality issue(s).' transformer-api-analysis.log
      - name: Compile pinned test sources
        run: mvn -B -ntp -f transformer-api/pom.xml test-compile -DskipTests
      - name: Collect test-source findings
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f transformer-api/pom.xml \
            io.github.nbauma109:static-analysis-maven-plugin:0.1.1-SNAPSHOT:check-tests \
            -DstaticAnalysis.profile=sonar-way \
            -DstaticAnalysis.failOnViolation=false \
            | tee transformer-api-test-analysis.log
      - name: Verify all 26 issue locations and rule identifiers
        run: python3 scripts/verify-transformer-api-parity.py transformer-api-analysis.log transformer-api-test-analysis.log
