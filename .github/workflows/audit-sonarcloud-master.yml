name: Audit public SonarCloud master issues

on:
  push:
    branches:
      - audit/sonarcloud-transformer-api-master

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve SonarCloud open issues
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          parameters = {
              "componentKeys": "nbauma109_transformer-api",
              "branch": "master",
              "issueStatuses": "OPEN",
              "ps": "500",
              "additionalFields": "_all",
          }
          url = "https://sonarcloud.io/api/issues/search?" + urlencode(parameters)
          request = Request(url, headers={"User-Agent": "GitHub-Actions-SonarCloud-Issue-Audit/1.0", "Accept": "application/json"})
          try:
              with urlopen(request, timeout=45) as response:
                  payload = json.load(response)
          except (HTTPError, URLError, ValueError) as error:
              print("SonarCloud issue API unavailable:", str(error))
              raise SystemExit(1) from error
          issues = payload.get("issues", [])
          print("SONAR_ISSUE_TOTAL", payload.get("total"), "RETRIEVED", len(issues))
          for issue in issues:
              if issue.get("rule") == "javabugs:S2259":
                  print("NULL_FLOW", json.dumps(issue.get("flows", []), ensure_ascii=True))
                  print("NULL_SECONDARY", json.dumps(issue.get("secondaryLocations", []), ensure_ascii=True))
                  print("NULL_CONTEXT", json.dumps(issue.get("message"), ensure_ascii=True))
              location = issue.get("component", "").split(":")[-1]
              position = issue.get("textRange", {}).get("startLine", issue.get("line", "?"))
              print("SONAR_ISSUE", json.dumps({
                  "key": issue.get("key"),
                  "rule": issue.get("rule"),
                  "component": location,
                  "line": position,
                  "message": issue.get("message"),
                  "status": issue.get("issueStatus", issue.get("status")),
                  "type": issue.get("type"),
              }, ensure_ascii=True, sort_keys=True))
          PY
