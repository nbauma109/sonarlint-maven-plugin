name: Build and integration tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify Maven Central packaging without signing or upload
        if: matrix.java == '17'
        run: mvn -B -ntp -Pcentral-release -Dgpg.skip=true clean verify
      - name: Verify standalone analysis
        run: bash scripts/integration-test.sh
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-java-${{ matrix.java }}
          path: target/integration-tests/
