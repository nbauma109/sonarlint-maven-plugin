name: Embedded JDT cleanup feasibility

on:
  push:
    branches:
      - spike/embedded-jdt-cleanups

permissions:
  contents: read

jobs:
  prove-headless-cleanups:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout static analysis Maven plugin
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile embedded JDT core manipulation probe
        run: mvn -B -ntp -f src/it/embedded-jdt-core/pom.xml compile
      - name: Checkout pinned transformer-api
        uses: actions/checkout@v4
        with:
          repository: nbauma109/transformer-api
          ref: fdc55663e6c9d5836db57e6369fd08d6bc4651cd
          path: transformer-api
      - name: Compile original transformer-api
        run: mvn -B -ntp -f transformer-api/pom.xml -DskipTests compile
      - name: Resolve transformer-api compiler classpath
        run: |
          mvn -B -ntp -f transformer-api/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.9.0:build-classpath \
            -Dmdep.outputFile=target/embedded-jdt-classpath.txt
      - name: Run genuine Eclipse core cleanup without an Eclipse installation
        shell: bash
        run: |
          set -euo pipefail
          export PROBE_CLASSPATH="$(cat transformer-api/target/embedded-jdt-classpath.txt)"
          mvn -B -ntp -f src/it/embedded-jdt-core/pom.xml \
            org.codehaus.mojo:exec-maven-plugin:3.5.1:java \
            -Dexec.mainClass=io.github.nbauma109.staticanalysis.EmbeddedJdtCleanupProbe \
            "-Dexec.args=$GITHUB_WORKSPACE/transformer-api"
      - name: Compile Java 17-compatible JDT alternative
        run: mvn -B -ntp -f src/it/embedded-jdt-java17/pom.xml compile
      - name: Compare older JDT cleanup with all eight source locations
        shell: bash
        run: |
          set -euo pipefail
          export PROBE_CLASSPATH="$(cat transformer-api/target/embedded-jdt-classpath.txt)"
          mvn -B -ntp -f src/it/embedded-jdt-java17/pom.xml \
            org.codehaus.mojo:exec-maven-plugin:3.5.1:java \
            -Dexec.mainClass=io.github.nbauma109.staticanalysis.EmbeddedJdtCleanupProbe \
            "-Dexec.args=$GITHUB_WORKSPACE/transformer-api"
  java17-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile older JDT cleanup adapter using Java 17
        run: mvn -B -ntp -f src/it/embedded-jdt-java17/pom.xml compile
