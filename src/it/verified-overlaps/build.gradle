plugins {
    id 'java'
    id 'io.github.nbauma109.static-analysis'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

staticAnalysis {
    profile = 'none'
    enabledRules = providers.gradleProperty('enabledRules')
            .getOrElse('java:S2129,java:S2293,java:S3878,java:S3626')
    failOnViolation = false
    eclipseEnabled = true
    eclipseExecutable = file(System.getenv('RUNNER_TEMP') + '/eclipse-check.sh')
    eclipseCleanupProfile = file('eclipse-cleanups.xml')
    eclipseDuplicatePolicy = providers.gradleProperty('duplicatePolicy').getOrElse('prefer-sonar')
}
